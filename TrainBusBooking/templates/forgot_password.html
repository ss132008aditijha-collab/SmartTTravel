<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SmartTravel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <a href="/">
            <span style="font-size: 26px;">🚆</span>
            <span>SmartTravel</span>
        </a>
    </div>

    <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="nav-links" id="mainNav">
        <a href="/">Home</a>
        <a href="/bookings">My Bookings</a>
        <a href="/login">Login</a>
        <a href="/register" class="register-btn">Register</a>
    </div>
</nav>

<!-- FORGOT PASSWORD CARD WRAPPER -->
<div class="auth-page-wrapper">
    <div class="auth-card">

        <div class="auth-card-header">
            <div class="auth-brand-icon">🔐</div>
            <h1>Forgot Password</h1>
            <p>Enter your registered email address to verify your account and set a new password</p>
        </div>

        {% if error %}
            <div class="alert-banner alert-error">
                <span>⚠️</span>
                <div>{{ error }}</div>
            </div>
        {% endif %}

        <form action="/forgot-password" method="POST">
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="e.g. aditi123@gmail.com"
                    value="{{ request.form.get('email', '') }}"
                    required
                    autocomplete="email">
            </div>

            <button type="submit" class="continue-btn" style="width: 100%; margin-top: 10px;">
                <span>Verify &amp; Continue</span>
                <span>→</span>
            </button>
        </form>

        <!-- Demo account hint -->
        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); text-align: center;">
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Demo hint:</p>
            <button
                type="button"
                onclick="document.getElementById('email').value='aditi123@gmail.com';"
                style="background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; padding: 5px 12px; cursor: pointer; color: var(--primary);">
                Use aditi123@gmail.com
            </button>
        </div>

        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Remember your password?
            <a href="/login" style="font-weight: 700; margin-left: 4px;">Back to Login</a>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
