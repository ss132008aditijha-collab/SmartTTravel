<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartTravel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <a href="/">
            <span style="font-size: 26px;">🚆</span>
            <span>SmartTravel</span>
        </a>
    </div>

    <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="nav-links" id="mainNav">
        <a href="/">Home</a>
        <a href="/bookings">My Bookings</a>
        <a href="/login">Login</a>
        <a href="/register" class="register-btn active">Register</a>
    </div>
</nav>

<!-- REGISTER CARD WRAPPER -->
<div class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 480px;">

        <div class="auth-card-header">
            <div class="auth-brand-icon">✨</div>
            <h1>Create an Account</h1>
            <p>Join SmartTravel for swift ticket bookings and instant e-tickets</p>
        </div>

        {% if error %}
            <div class="alert-banner alert-error">
                <span>⚠️</span>
                <div>{{ error }}</div>
            </div>
        {% endif %}

        <form action="/register" method="POST" id="registerForm">
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="e.g. Aditi Sharma"
                    value="{{ request.form.get('name', '') }}"
                    required
                    autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="name@example.com"
                    value="{{ request.form.get('email', '') }}"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (10 Digits)</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="form-control"
                    placeholder="9876543210"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    value="{{ request.form.get('phone', '') }}"
                    required
                    autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required
                        autocomplete="new-password">
                    <button type="button" class="toggle-password-btn" data-target="password" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="strength-meter-container">
                    <div class="strength-meter-bar" id="passwordStrengthBar"></div>
                </div>
                <div style="display: flex; justify-content: flex-end; font-size: 11px; color: var(--text-muted); margin-top: 4px;" id="passwordStrengthLabel"></div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                        autocomplete="new-password">
                    <button type="button" class="toggle-password-btn" data-target="confirm_password" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div style="margin-bottom: 22px; font-size: 13px; color: var(--text-secondary);">
                By registering, you agree to SmartTravel's Terms of Service &amp; Privacy Policy.
            </div>

            <button type="submit" class="continue-btn" style="width: 100%;">
                <span>Create Account</span>
                <span>→</span>
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Already have an account?
            <a href="/login" style="font-weight: 700; margin-left: 4px;">Sign In</a>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
