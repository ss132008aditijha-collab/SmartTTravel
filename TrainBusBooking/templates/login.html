<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartTravel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <a href="/">
            <span style="font-size: 26px;">🚆</span>
            <span>SmartTravel</span>
        </a>
    </div>

    <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <div class="nav-links" id="mainNav">
        <a href="/">Home</a>
        <a href="/bookings">My Bookings</a>
        <a href="/login" class="active">Login</a>
        <a href="/register" class="register-btn">Register</a>
    </div>
</nav>

<!-- LOGIN CARD WRAPPER -->
<div class="auth-page-wrapper">
    <div class="auth-card">

        <div class="auth-card-header">
            <div class="auth-brand-icon">🚆</div>
            <h1>Welcome Back</h1>
            <p>Log in to access your bookings and travel preferences</p>
        </div>

        {% if error %}
            <div class="alert-banner alert-error">
                <span>⚠️</span>
                <div>{{ error }}</div>
            </div>
        {% endif %}

        {% if message %}
            <div class="alert-banner alert-success">
                <span>✓</span>
                <div>{{ message }}</div>
            </div>
        {% endif %}

        <form action="/login" method="POST" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="e.g. aditi123@gmail.com"
                    value="{{ request.form.get('email', '') }}"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" data-target="password" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" name="remember" checked style="accent-color: var(--primary);"> Remember me
                </label>
                <a href="/forgot-password" style="font-weight: 600;">Forgot Password?</a>
            </div>

            <button type="submit" class="continue-btn" style="width: 100%;">
                <span>Log In</span>
                <span>→</span>
            </button>
        </form>

        <!-- Quick Demo Fill -->
        <div style="margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); text-align: center;">
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Demo Account Quick-Fill:</p>
            <button
                type="button"
                onclick="document.getElementById('email').value='aditi123@gmail.com'; document.getElementById('password').value='123456';"
                style="background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; color: var(--primary);">
                👤 Fill Demo User (aditi123@gmail.com)
            </button>
        </div>

        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-secondary);">
            Don't have an account yet?
            <a href="/register" style="font-weight: 700; margin-left: 4px;">Create Account</a>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
